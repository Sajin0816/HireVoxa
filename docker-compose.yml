services:
  hirevoxa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirevoxa-production-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CLIENT_URL=http://localhost:5000
      - RESUME_STORAGE_DIR=/app/server/storage/resumes
    volumes:
      - resume-storage:/app/server/storage/resumes
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  resume-storage:
    driver: local
